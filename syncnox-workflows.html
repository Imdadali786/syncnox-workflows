<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syncnox Advanced workflows</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap');

  body{margin:0;background:#fff}
  #wf{
    --gray-10:#f4f4f4; --gray-20:#e0e0e0; --gray-30:#c6c6c6; --gray-50:#8d8d8d; --gray-70:#525252; --ink:#161616;
    --accent:#015c11; --bright:#00c80d; --g-050:#EAF3DA;
    --muted:var(--gray-70); --faint:var(--gray-50);
    --grad:linear-gradient(90deg,#015c11,#00c80d);
    --scr:#FBFCF8; --scr-bar:#F2F4EC; --wire:#D2D6C8; --line:#E6E8E0;
    --f:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.2,0,.38,.9); --ease-soft:cubic-bezier(.16,1,.3,1); --ease-out:cubic-bezier(.22,1,.36,1);
    font-family:var(--f);color:var(--muted);line-height:1.5;-webkit-font-smoothing:antialiased;
    font-feature-settings:"zero" 0,"ss01" 0;font-variant-numeric:lining-nums tabular-nums;
    background:#fff;padding:clamp(64px,8vw,112px) 0;position:relative;
  }
  #wf *,#wf *::before,#wf *::after{box-sizing:border-box;border-radius:0}
  #wf .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
  #wf svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* header */
  #wf .sec-head{text-align:center;max-width:800px;margin:0 auto clamp(32px,4vw,48px)}
  #wf .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:10px;margin:0 0 18px}
  #wf .eyebrow::before{content:"";width:22px;height:3px;background:var(--grad)}
  #wf h2{font-weight:400;letter-spacing:-.025em;line-height:1.08;font-size:clamp(30px,3.9vw,46px);margin:0;
    background:linear-gradient(100deg,#0A0A0A 0%,#013a0b 46%,#00c80d 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  #wf h2 .hl{font-weight:600}
  #wf .sec-head p{margin:18px auto 0;font-size:1.06rem;line-height:1.6;max-width:58ch}

  /* four kinds of trigger */
  #wf .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:clamp(12px,2vw,26px);margin-bottom:20px}
  #wf .tab{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center;padding:18px 0 4px;background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;color:inherit}
  #wf .tab .b2{position:absolute;left:0;right:0;top:0;height:3px;background:var(--gray-10);overflow:hidden}
  #wf .tab .b2 i{display:block;height:100%;width:0;background:var(--accent)}
  #wf .tab.on .b2 i{width:100%}
  #wf .tab.on.run .b2 i{width:0;animation:wfFill var(--dw,7000ms) linear forwards}
  #wf .tab.on.run.hold .b2 i{animation-play-state:paused}
  @keyframes wfFill{to{width:100%}}
  #wf .tab .pi{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--gray-10);color:var(--muted);transition:background .3s,color .3s}
  #wf .tab.on .pi{background:var(--accent);color:#fff}
  #wf .tab b{display:block;font-size:1rem;font-weight:600;letter-spacing:-.01em;line-height:1.3;color:var(--muted);transition:color .3s}
  #wf .tab.on b,#wf .tab:hover b{color:var(--ink)}
  #wf .tab:focus-visible,#wf .ib:focus-visible,#wf .tk:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* frame + screen */
  #wf .frame{position:relative;background:linear-gradient(150deg,#000 0%,#013a0b 42%,#00c80d 100%);padding:clamp(10px,2.6vw,34px);overflow:hidden}
  #wf .frame::before{content:"";position:absolute;inset:0;background:radial-gradient(560px circle at var(--mx,24%) var(--my,14%),rgba(90,255,120,.42),rgba(0,200,13,.15) 46%,transparent 74%);pointer-events:none}
  #wf .scr{position:relative;z-index:1;background:var(--scr);box-shadow:0 30px 60px rgba(8,16,4,.45)}
  #wf .bar{display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 16px;background:var(--scr-bar);font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink)}
  #wf .bar .sq{width:8px;height:8px;background:var(--accent);flex:none}
  #wf .bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #wf .bar .t em{font-style:normal;color:var(--faint);font-weight:500}
  #wf .bar .w::after{content:"· ";color:var(--faint);font-weight:500}
  #wf .ticks{margin-left:auto;display:flex;gap:4px;padding-right:6px}
  #wf .tk{width:22px;height:30px;padding:0;border:none;background:none;cursor:pointer;display:flex;align-items:center}
  #wf .tk i{display:block;width:100%;height:3px;background:var(--gray-30);transition:background .3s}
  #wf .tk.on i{background:var(--accent)}
  #wf .ib{width:30px;height:30px;flex:none;border:none;background:none;color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
  #wf .ib:hover{background:#fff;color:var(--ink)}
  #wf .ib svg{width:15px;height:15px}

  /* the canvas: a dotted board the blocks sit on */
  #wf .cv{position:relative;min-height:200px;background-color:#F6F8F1;background-image:radial-gradient(rgba(22,22,22,.2) 1px,transparent 1.2px);background-size:16px 16px;background-position:8px 8px;overflow:hidden;transition:box-shadow .2s}
  #wf .cv.free{height:500px}
  #wf .cv.over{box-shadow:inset 0 0 0 2px var(--accent)}
  #wf .wires{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  /* connectors are dotted; once an event has passed, the dots turn green and move along the line */
  #wf .wires path{fill:none;stroke-width:2.5;stroke-dasharray:2.5 6}
  #wf .wires .wb{stroke:#A9AE9C}
  #wf .wires .wl{stroke:var(--accent);stroke-width:3;opacity:0;transition:opacity .25s}
  #wf .wires .wl.on{opacity:1}
  #wf .wires .wl.flow{animation:wfMarch .7s linear infinite}
  @keyframes wfMarch{to{stroke-dashoffset:-17}}
  #wf .wires rect{fill:var(--accent);stroke:#fff;stroke-width:2;opacity:0}
  /* a block */
  #wf .nd{display:grid;grid-template-columns:40px minmax(0,1fr);gap:13px;align-items:center;height:96px;padding:0 16px 0 14px;background:#fff;min-width:0;
    box-shadow:0 1px 0 rgba(22,22,22,.05),0 14px 30px -18px rgba(22,22,22,.28);opacity:0;transform:translateY(10px);transition:opacity .4s var(--ease),transform .55s var(--ease-out),box-shadow .25s}
  #wf .nd.in{opacity:1;transform:none}
  #wf .cv.free .nd{position:absolute;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
  #wf .cv.free .nd.snap{transition:left .18s var(--ease-out),top .18s var(--ease-out),box-shadow .25s}
  #wf .nd.drag{cursor:grabbing;z-index:5;transition:none!important;box-shadow:0 0 0 2px var(--ink),0 26px 44px -18px rgba(22,22,22,.45)}
  #wf .nd.run{box-shadow:0 0 0 2px var(--kc),0 18px 34px -18px rgba(22,22,22,.34)}
  #wf .cv.free .nd:hover{box-shadow:0 0 0 1px var(--gray-30),0 18px 34px -18px rgba(22,22,22,.34)}
  #wf .cv.free .nd.run,#wf .cv.free .nd.run:hover{box-shadow:0 0 0 2px var(--kc),0 18px 34px -18px rgba(22,22,22,.34)}
  #wf .cv.free .nd.drag,#wf .cv.free .nd.drag:hover{box-shadow:0 0 0 2px var(--ink),0 26px 44px -18px rgba(22,22,22,.45)}
  #wf .ni{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--kc);color:#fff}
  #wf .ni svg{width:19px;height:19px}
  #wf .nt{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em;line-height:1.25;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #wf .ns{display:block;margin-top:3px;font-size:14px;line-height:1.38;color:var(--muted);transition:opacity .22s var(--ease),color .3s;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #wf .ns.sw{opacity:0}
  #wf .nd.done .ns{color:var(--ink)}
  #wf .tg{position:absolute;left:0;top:-21px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--ink);white-space:nowrap;pointer-events:none}
  /* connection points */
  #wf .pt{position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
  #wf .pt.l{left:-5px} #wf .pt.r{right:-5px}
  #wf .ck{position:absolute;right:0;top:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;opacity:0;transform:scale(.5);transition:opacity .25s,transform .45s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
  #wf .ck svg{width:12px;height:12px;stroke-width:3}
  #wf .nd.done .ck{opacity:1;transform:none}
  #wf .rm{position:absolute;right:0;bottom:0;width:22px;height:22px;padding:0;border:none;background:var(--gray-10);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s,background .2s,color .2s}
  #wf .rm svg{width:11px;height:11px;stroke-width:2.4}
  #wf .nd:hover .rm,#wf .rm:focus-visible{opacity:1}
  #wf .rm:hover{background:var(--ink);color:#fff}
  #wf .cv.one .rm{display:none}
  #wf .hint{position:absolute;left:14px;bottom:12px;display:inline-flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;font-size:12.5px;font-weight:500;color:var(--ink);pointer-events:none;box-shadow:0 8px 18px -12px rgba(22,22,22,.4);transition:opacity .4s}
  #wf .hint svg{width:14px;height:14px}
  #wf .hint.off{opacity:0}

  /* the dock: blocks to add, and the controls */
  #wf .dock{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;padding:11px 14px;background:#fff;box-shadow:0 -1px 0 var(--line)}
  #wf .dk{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--faint);margin-right:6px}
  #wf .chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 8px;border:none;background:var(--gray-10);font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;transition:background .2s,opacity .2s}
  #wf .chip .gr{color:var(--gray-50);display:flex}
  #wf .chip .gr svg{width:14px;height:14px}
  #wf .chip i{width:9px;height:9px;background:var(--kc)}
  #wf .chip:hover{background:var(--gray-20)}
  #wf .dock.full .chip{opacity:.4;cursor:not-allowed}
  #wf .sp{flex:1}
  #wf .rs{height:36px;padding:0 12px;border:none;background:none;font-family:inherit;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
  #wf .rs:hover{color:var(--ink)}
  #wf .go{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:none;background:var(--ink);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
  #wf .go svg{width:13px;height:13px;stroke-width:2.2}
  #wf .go:hover{background:var(--accent)}
  #wf .chip:focus-visible,#wf .go:focus-visible,#wf .rs:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* the block that follows the pointer while it is dragged in from the dock */
  .wf-ghost{position:fixed;left:0;top:0;z-index:9999;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 6px;background:#fff;font:600 15px "Geist",-apple-system,"Segoe UI",Arial,sans-serif;color:#161616;box-shadow:0 0 0 2px #161616,0 22px 40px -16px rgba(22,22,22,.5);pointer-events:none;transform:translate(-50%,-50%)}
  .wf-ghost i{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#fff}
  .wf-ghost svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  /* what the blocks are made of */
  #wf .kit{margin-top:clamp(26px,3.6vw,40px);border-top:1px solid var(--ink)}
  #wf .kr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--line)}
  #wf .kr b{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink)}
  #wf .kr ul{display:flex;flex-wrap:wrap;gap:6px 26px;margin:0;padding:0;list-style:none}
  #wf .kr li{display:inline-flex;align-items:center;gap:9px;font-size:15.5px;font-weight:500;color:var(--ink)}
  #wf .kr li svg{width:16px;height:16px;color:var(--muted)}
  #wf .fine{margin:16px 0 0;text-align:center;font-size:12.5px;color:var(--faint)}

  #wf .reveal{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease-soft),transform .8s var(--ease-soft)}
  #wf .reveal.in{opacity:1;transform:none}
  #wf .reveal.d1{transition-delay:.1s}

  @media(max-width:940px){
    #wf .tabs{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:6px}
    #wf .kr{grid-template-columns:minmax(0,1fr);gap:8px}
  }
  /* stacked layout (phones, tablets): blocks in a column, the dotted wire in a gutter on the left */
  #wf .cv.stack{padding:20px 16px 24px 44px}
  #wf .cv.stack .nodes{display:flex;flex-direction:column;gap:10px}
  #wf .cv.stack .nd{position:relative}
  #wf .cv.stack .nd.tagged{margin-top:26px}
  #wf .cv.stack .nd.tagged:first-child{margin-top:20px}
  #wf .cv.stack .pt,#wf .cv.stack .hint{display:none}
  #wf .cv.stack .rm{opacity:1}
  @media(max-width:640px){
    #wf .bar{font-size:10.5px;gap:4px;padding-left:12px}
    #wf .bar .w{display:none}
    #wf .bar .t em{color:var(--ink);font-weight:600}
    #wf .tk{width:14px}
    #wf .ticks{gap:3px;padding-right:2px}
    #wf .cv.stack{padding:18px 12px 20px 38px}
    #wf .nd{grid-template-columns:36px minmax(0,1fr);gap:12px;padding:0 14px 0 12px}
    #wf .ni{width:36px;height:36px}
    #wf .nt{font-size:15.5px}
    #wf .ns{font-size:13.5px}
    #wf .kr li{font-size:15px}
    #wf .dock{padding:10px 12px}
    #wf .dk{flex-basis:100%}
    #wf .chip{height:34px;font-size:13.5px;padding:0 10px 0 8px}
    #wf .chip .gr{display:none}
    #wf .sp{flex-basis:100%;height:0}
    #wf .go{flex:1;justify-content:center}
  }
  @media(max-width:560px){
    #wf .tabs{grid-template-columns:minmax(0,1fr);row-gap:2px;margin-bottom:16px}
    #wf .tab{padding:10px 0 10px 14px}
    #wf .tab .b2{right:auto;bottom:0;width:3px;height:auto}
    #wf .tab .b2 i{width:100%!important;height:0}
    #wf .tab.on .b2 i{height:100%}
    #wf .tab.on.run .b2 i{height:0;animation:wfFillV var(--dw,7000ms) linear forwards}
    @keyframes wfFillV{to{height:100%}}
  }
  @media(prefers-reduced-motion:reduce){
    #wf *{animation:none!important;transition:none!important}
    #wf .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

<section id="wf" aria-labelledby="wfTitle">
  <div class="wrap">
    <div class="sec-head reveal">
      <span class="eyebrow">Advanced workflows</span>
      <h2 id="wfTitle">Draw the rule once.<br><span class="hl">Syncnox runs it every time.</span></h2>
      <p>Build workflows on a visual canvas. Pick the event that starts it, add a condition, and connect the actions that should follow.</p>
    </div>

    <div class="reveal d1">
      <div class="tabs" id="wfTabs" role="tablist" aria-label="Kinds of trigger"></div>
      <div class="frame" id="wfFrame">
        <div class="scr">
          <div class="bar"><span class="sq"></span><span class="t"><span class="w">Workflow </span><em id="wfName"></em></span>
            <span class="ticks" id="wfTicks" role="group" aria-label="Examples for this trigger"></span>
            <button type="button" class="ib" id="wfPrev" aria-label="Previous example"></button><button type="button" class="ib" id="wfNext" aria-label="Next example"></button>
            <button type="button" class="ib" id="wfPlay" aria-label="Pause"></button></div>
          <div class="cv" id="wfCv">
            <svg class="wires" id="wfW" aria-hidden="true"></svg>
            <div class="nodes" id="wfN"></div>
            <span class="hint" id="wfHint"></span>
          </div>
          <div class="dock" id="wfDock"><span class="dk">ADD A BLOCK</span><span id="wfPal" style="display:contents"></span><span class="sp"></span>
            <button type="button" class="rs" id="wfReset">Reset</button><button type="button" class="go" id="wfRun"></button></div>
        </div>
      </div>
      <p class="fine">Illustrative examples. Names, numbers and thresholds are placeholders.</p>
      <div class="kit" id="wfKit"></div>
    </div>
  </div>
</section>

<script>
(function(){
  var root=document.getElementById('wf'); if(!root) return;

      else { if(!moved){ auto(); } n.w=T.w; moved=true; n.x=Math.round(Math.max(0,Math.min(px-n.w/2,cv.clientWidth-n.w))/8)*8; n.y=Math.round(Math.max(22,Math.min(py-NH/2,cv.clientHeight-NH))/8)*8; put(n); } }

  /* ================= dragging ================= */
  function touch(){ if(!paused&&playing){ paused=true; setPlayIcon(); sync(); } $('wfHint').classList.add('off'); }
  function dragNode(n){ n.el.addEventListener('pointerdown',function(e){ if(!free||e.button>0||e.target.closest('.rm')) return; e.preventDefault(); touch();
      var sx=e.clientX, sy=e.clientY, ox=n.x, oy=n.y, CW=cv.clientWidth, CH=cv.clientHeight; n.el.setPointerCapture(e.pointerId); n.el.classList.add('drag'); n.el.classList.remove('snap');

        n.x=Math.round(n.x/8)*8; n.y=Math.round(n.y/8)*8; put(n,true); var t0=performance.now(); (function f(t){ draw(); if(t-t0<220) requestAnimationFrame(f); })(t0); }
      n.el.addEventListener('pointermove',mv); n.el.addEventListener('pointerup',up); n.el.addEventListener('pointercancel',up); }); }
  /* a block dragged in from the dock follows the pointer and lands where it is dropped */
  [].forEach.call($('wfPal').children,function(chip){ var k=+chip.getAttribute('data-k');
    chip.addEventListener('pointerdown',function(e){ if(e.button>0) return; var sx=e.clientX, sy=e.clientY, ghost=null, a=ADD[k]; chip.setPointerCapture(e.pointerId);
      function over(ev){ var r=cv.getBoundingClientRect(); return ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom; }
      function mv(ev){ if(!ghost&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>6&&free&&A.length<MAXA){ ghost=document.createElement('div'); ghost.className='wf-ghost'; ghost.innerHTML='<i style="background:'+KCOL[a[0]]+'">'+ic(KICON[a[0]])+'</i>'+a[2]; document.body.appendChild(ghost); }
        if(ghost){ ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px'; cv.classList.toggle('over',over(ev)); } }
      function up(ev){ chip.removeEventListener('pointermove',mv); chip.removeEventListener('pointerup',up); chip.removeEventListener('pointercancel',up); cv.classList.remove('over');
        if(ghost){ document.body.removeChild(ghost); if(ev.type==='pointerup'&&over(ev)){ var r=cv.getBoundingClientRect(); addAction(k,ev.clientX-r.left,ev.clientY-r.top); } }
        else if(ev.type==='pointerup') addAction(k); }
      chip.addEventListener('pointermove',mv); chip.addEventListener('pointerup',up); chip.addEventListener('pointercancel',up); });
    chip.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); addAction(k); } }); });

  /* ================= running an event through whatever is on the canvas ================= */
  function done(n){ var s=n.el.querySelector('.ns'); n.el.classList.remove('run'); if(reduce){ s.textContent=n.doneText; n.el.classList.add('done'); return; }
    s.classList.add('sw'); setTimeout(function(){ s.textContent=n.doneText; s.classList.remove('sw'); n.el.classList.add('done'); },200); }
  function pulse(e,ms){ e.wl.classList.add('on','flow'); if(reduce) return; var L=e.wl.getTotalLength(), t0=performance.now(), my=e.k=(e.k||0)+1;
    (function f(t){ if(e.k!==my||!e.wl.isConnected) return; var k=Math.min(1,(t-t0)/ms), q=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2, p=e.wl.getPointAtLength(L*q); e.pz.setAttribute('x',p.x-3.5); e.pz.setAttribute('y',p.y-3.5); e.pz.style.opacity=k<1?1:0; if(k<1) requestAnimationFrame(f); })(t0); }
  function clearRun(){ nodes().forEach(function(n){ n.el.classList.remove('run','done'); var s=n.el.querySelector('.ns'); s.textContent=n.sub; s.classList.remove('sw'); }); E.forEach(function(e){ e.k=(e.k||0)+1; e.pz.style.opacity=0; e.wl.classList.remove('on','flow'); }); }
  function run(t0){ var acts=A.slice(), es=E.slice();
    later(function(){ clearRun(); T.el.classList.add('run'); },t0);
    later(function(){ done(T); pulse(es[0],440); },t0+450);
    later(function(){ C.el.classList.add('run'); },t0+890);
    later(function(){ done(C); },t0+1420);
    acts.forEach(function(n,a){ later(function(){ if(es[a+1]) pulse(es[a+1],480); },t0+1680+a*170); later(function(){ n.el.classList.add('run'); },t0+2160+a*170); later(function(){ done(n); },t0+2680+a*300); });
    later(function(){ es.forEach(function(e){ e.wl.classList.remove('flow'); }); },t0+2680+acts.length*300+1500); }
  $('wfRun').addEventListener('click',function(){ if(cur<0) return; touch(); tm.forEach(clearTimeout); tm=[]; run(0); });
  $('wfReset').addEventListener('click',function(){ if(cur<0) return; tm.forEach(clearTimeout); tm=[]; build(W[cur]); nodes().forEach(function(n){ n.el.classList.add('in'); }); run(500); });

  function step(i){

    ticks.forEach(function(t,k){ t.classList.toggle('on',k===i-first[s.f]); });
    root.style.setProperty('--dw',DW+'ms'); if(playing){ void tabs[s.f].offsetWidth; tabs[s.f].classList.add('run'); }
    $('wfName').textContent=s.n; build(s);
    nodes().forEach(function(n,k){ later(function(){ n.el.classList.add('in'); },60+k*90); });
    run(1100); sched();
  }

  /* ================= autoplay (stops as soon as the visitor starts building) ================= */
  var playing=!reduce, inView=false, paused=false, tick=null, t0=0, spent=0, started=false;
  function advancing(){ return playing&&!paused&&inView&&cur>-1; }
  function sched(){ spent=0; t0=0; sync(); }
  function sync(){
    tabs.forEach(function(b){ b.classList.toggle('hold',!advancing()); });
    clearTimeout(tick); tick=null;

    else if(t0){ spent+=Date.now()-t0; t0=0; }
  }
  function userStep(i){ playing=!reduce; paused=false; setPlayIcon(); step(i); }
  function setPlayIcon(){ var b=$('wfPlay'), stopped=paused||!playing; b.innerHTML=ic(stopped?'play':'pause'); b.setAttribute('aria-label',stopped?'Play':'Pause'); }
  $('wfPlay').addEventListener('click',function(){ paused=!paused; setPlayIcon(); sync(); });
  var frame=$('wfFrame');
  frame.addEventListener('pointermove',function(e){ var r=frame.getBoundingClientRect(); frame.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%'); frame.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%'); });

  /* first paint: the first workflow is already on the canvas */
  mode(); build(W[0]); $('wfName').textContent=W[0].n; tabs[0].classList.add('on'); ticks[0].classList.add('on'); nodes().forEach(function(n){ n.el.classList.add('in'); });
  setPlayIcon(); draw();

    var ro=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); ro.unobserve(e.target);} }); },{threshold:.06});
    reveals.forEach(function(x){ro.observe(x);});
    var vo=new IntersectionObserver(function(es){ inView=es[0].isIntersecting; if(inView&&!started){ started=true; step(0); } else sync(); },{threshold:.25});
    vo.observe(frame);
  } else { reveals.forEach(function(x){x.classList.add('in');}); inView=true; step(0); }
})();
</script>

<script>
/* iframe helper: report real height to the parent page */
(function(){
  if(window.parent===window)return;
  var last=0;
  function send(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h&&h!==last){last=h;window.parent.postMessage({syncnoxFrame:'workflows',height:h},'*');}
  }
  if('ResizeObserver' in window){new ResizeObserver(send).observe(document.documentElement);}
  window.addEventListener('load',send);
  window.addEventListener('resize',send);
  send();
})();
</script>
